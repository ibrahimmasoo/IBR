<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IBR Dashboard - Messages</title>
  <link rel="stylesheet" href="admin.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.3.0/fonts/remixicon.css" rel="stylesheet">
</head>
<body>
  <div class="admin-shell">
    <aside class="sidebar">
      <a href="admin.html" class="brand">IBR <span>Dashboard</span></a>
      <a href="index.html"><i class="ri-home-5-line"></i> Back to site</a>
      <a href="admin.html"><i class="ri-dashboard-line"></i> Dashboard Home</a>
      <a href="admin-messages.html"><i class="ri-mail-line"></i> Messages</a>
      <a href="admin-content.html"><i class="ri-text"></i> Edit Texts</a>
      <a href="admin-projects.html"><i class="ri-stack-line"></i> Edit Projects</a>
      <a href="admin-gallery.html"><i class="ri-image-line"></i> Edit Gallery</a>
      <a href="admin-branding.html"><i class="ri-image-edit-line"></i> Branding & Links</a>
      <a href="admin-analytics.html"><i class="ri-bar-chart-box-line"></i> Analytics</a>
    </aside>

    <main class="main">
      <header class="topbar">
        <div>
          <h1>Messages</h1>
          <p>View messages submitted from the website contact form.</p>
        </div>
        <div class="topbar-actions">
          <div class="status-badge" id="connectionStatus">Checking session...</div>
          <button type="button" class="table-btn" id="logoutBtn">Logout</button>
        </div>
      </header>

      <section>
        <div class="section-head">
          <h2>Inbox</h2>
        </div>
        <div class="card table-wrap">
          <div id="messagesTable">Loading messages...</div>
        </div>
      </section>
    </main>
  </div>

  <div class="toast" id="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="admin.js"></script>
</body>
</html>
