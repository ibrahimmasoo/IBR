<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Texts | IBR Dashboard</title>
  <link rel="stylesheet" href="admin.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.3.0/fonts/remixicon.css" rel="stylesheet">
</head>
<body>
  <div class="admin-shell">
    <aside class="sidebar">
      <a href="admin.html" class="brand">IBR <span>Dashboard</span></a>
      <a href="index.html"><i class="ri-home-5-line"></i> Back to site</a>
      <a href="admin.html"><i class="ri-dashboard-line"></i> Dashboard Home</a>
      <a href="admin-content.html"><i class="ri-text"></i> Edit Texts</a>
      <a href="admin-projects.html"><i class="ri-stack-line"></i> Edit Projects</a>
      <a href="admin-gallery.html"><i class="ri-image-line"></i> Edit Gallery</a>
      <a href="admin-branding.html"><i class="ri-image-edit-line"></i> Branding & Links</a>
      <a href="admin-analytics.html"><i class="ri-bar-chart-box-line"></i> Analytics</a>
    </aside>

    <main class="main">
      <header class="topbar">
        <div>
          <h1>Edit Texts</h1>
          <p>Manage default, Arabic, and Turkish texts for your website.</p>
        </div>
        <div class="topbar-actions">
          <div class="status-badge" id="connectionStatus">Checking session...</div>
          <button type="button" class="table-btn" id="logoutBtn">Logout</button>
        </div>
      </header>

      <div class="notice">Only your signed-in account can open and edit this page.</div>
      <section id="content">
        <div class="section-head"><h2>Texts</h2></div>
        <form id="contentForm" class="panel-form card form-grid two-col">
          <input name="hero_title" placeholder="Hero title">
          <input name="hero_subtitle" placeholder="Hero subtitle">
          <textarea name="hero_description" placeholder="Hero description"></textarea>
          <input name="about_heading" placeholder="About heading">
          <input name="about_subtitle" placeholder="About subtitle">
          <textarea name="about_paragraph_1" placeholder="About paragraph 1"></textarea>
          <textarea name="about_paragraph_2" placeholder="About paragraph 2"></textarea>
          <textarea name="about_paragraph_3" placeholder="About paragraph 3"></textarea>
          <textarea name="about_paragraph_4" placeholder="About paragraph 4"></textarea>
          <input name="projects_heading" placeholder="Projects heading">
          <textarea name="projects_description" placeholder="Projects description"></textarea>
          <input name="gallery_heading" placeholder="Gallery heading">
          <textarea name="gallery_description" placeholder="Gallery description"></textarea>
          <input name="platforms_heading" placeholder="Platforms heading">
          <textarea name="platforms_description" placeholder="Platforms description"></textarea>
          <input name="contact_label" placeholder="Contact label">
          <input name="contact_title" placeholder="Contact title">
          <textarea name="contact_description" placeholder="Contact description"></textarea>
          <input name="contact_email" placeholder="Contact email">
          <input name="contact_email_url" placeholder="Contact email URL or mailto link">
          <input name="contact_linkedin_url" placeholder="LinkedIn URL">
          <input name="support_heading" placeholder="Support heading">
          <textarea name="support_description" placeholder="Support description"></textarea>
          <input name="footer_text" placeholder="Footer text">
          <div class="form-actions full">
            <button type="submit" class="primary-btn">Save texts</button>
          </div>
        </form>
      </section>

      <section id="content-ar">
        <div class="section-head"><h2>Arabic Texts</h2></div>
        <form id="contentFormAr" class="panel-form card form-grid two-col">
          <input name="hero_title" placeholder="عنوان البطل">
          <input name="hero_subtitle" placeholder="العنوان الفرعي للبطل">
          <textarea name="hero_description" placeholder="وصف البطل"></textarea>
          <input name="about_heading" placeholder="عنوان قسم من أنا">
          <input name="about_subtitle" placeholder="العنوان الفرعي لقسم من أنا">
          <textarea name="about_paragraph_1" placeholder="الفقرة الأولى"></textarea>
          <textarea name="about_paragraph_2" placeholder="الفقرة الثانية"></textarea>
          <textarea name="about_paragraph_3" placeholder="الفقرة الثالثة"></textarea>
          <textarea name="about_paragraph_4" placeholder="الفقرة الرابعة"></textarea>
          <input name="projects_heading" placeholder="عنوان المشاريع">
          <textarea name="projects_description" placeholder="وصف المشاريع"></textarea>
          <input name="gallery_heading" placeholder="عنوان المعرض">
          <textarea name="gallery_description" placeholder="وصف المعرض"></textarea>
          <input name="platforms_heading" placeholder="عنوان المنصات">
          <textarea name="platforms_description" placeholder="وصف المنصات"></textarea>
          <input name="contact_label" placeholder="وسم التواصل">
          <input name="contact_title" placeholder="عنوان التواصل">
          <textarea name="contact_description" placeholder="وصف التواصل"></textarea>
          <input name="support_heading" placeholder="عنوان الدعم">
          <textarea name="support_description" placeholder="وصف الدعم"></textarea>
          <input name="footer_text" placeholder="نص الفوتر">
          <div class="form-actions full">
            <button type="submit" class="primary-btn">Save Arabic Texts</button>
          </div>
        </form>
      </section>

      <section id="content-tr">
        <div class="section-head"><h2>Turkish Texts</h2></div>
        <form id="contentFormTr" class="panel-form card form-grid two-col">
          <input name="hero_title" placeholder="Kahraman başlığı">
          <input name="hero_subtitle" placeholder="Kahraman alt başlığı">
          <textarea name="hero_description" placeholder="Kahraman açıklaması"></textarea>
          <input name="about_heading" placeholder="Hakkımda başlığı">
          <input name="about_subtitle" placeholder="Hakkımda alt başlığı">
          <textarea name="about_paragraph_1" placeholder="1. paragraf"></textarea>
          <textarea name="about_paragraph_2" placeholder="2. paragraf"></textarea>
          <textarea name="about_paragraph_3" placeholder="3. paragraf"></textarea>
          <textarea name="about_paragraph_4" placeholder="4. paragraf"></textarea>
          <input name="projects_heading" placeholder="Projeler başlığı">
          <textarea name="projects_description" placeholder="Projeler açıklaması"></textarea>
          <input name="gallery_heading" placeholder="Galeri başlığı">
          <textarea name="gallery_description" placeholder="Galeri açıklaması"></textarea>
          <input name="platforms_heading" placeholder="Platformlar başlığı">
          <textarea name="platforms_description" placeholder="Platformlar açıklaması"></textarea>
          <input name="contact_label" placeholder="İletişim etiketi">
          <input name="contact_title" placeholder="İletişim başlığı">
          <textarea name="contact_description" placeholder="İletişim açıklaması"></textarea>
          <input name="support_heading" placeholder="Destek başlığı">
          <textarea name="support_description" placeholder="Destek açıklaması"></textarea>
          <input name="footer_text" placeholder="Footer metni">
          <div class="form-actions full">
            <button type="submit" class="primary-btn">Save Turkish Texts</button>
          </div>
        </form>
      </section>

    </main>
  </div>

  <div class="toast" id="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="admin.js"></script>
</body>
</html>
